blueprint:
  name: 扫地机分区定时清扫
  description: |
    到点用 HA 指定的房间清扫，支持按星期、扫地/拖地意图、以及"区域内有人则跳过并重试"。

    ## 这个蓝图解决什么

    - **时间**：每天某个时刻触发；用「星期」输入限定每周哪几天（全选＝每天）。
    - **区域**：直接选 HA 区域（客厅/餐厅…），不依赖设备里的例程。
    - **扫地还是拖地**：见下面「扫地/拖地怎么表达」。
    - **有人跳过**：填了人体传感器就只在无人时扫；没填就是到点就扫。
    - **失败重试**：触发时如果因为有人、扫地机正忙、门打不开等原因没扫成，
      会在指定窗口内反复重试；窗口内始终不成才告警。

    ## 扫地/拖地怎么表达

    V1 协议没有「仅扫地/仅拖地/扫拖一体」这个开关，它是用**底层参数**组合出来的
    （依据 python-roborock 的 `CleaningMode` 抽象，其中 `VACUUM` 对应水量 `off`）：

    | 意图 | 拖地强度 | 风机 |
    | --- | --- | --- |
    | 仅扫地 | `off`（水量关＝干扫） | 不变 |
    | 扫拖一体 | 你选的水量 | 不变 |
    | 仅拖地 | 你选的水量 | `off_raise_main_brush`（抬主刷） |

    ⚠️ **不要**把「拖地模式」（`standard`/`deep`/`deep_plus`）当成扫地/拖地——
    那是「拖地走几遍的路线」，与扫地还是拖地无关。

    ## 前置条件

    必须先在 **设置 → 设备与服务 → 该扫地机 → 齿轮 → 区域映射** 里，
    把 HA 区域对应到设备的房间号。否则 `vacuum.clean_area` 会直接报错。

    ## 判断"清扫真的启动了"

    看集成的「任务进行中」二元传感器，而不是看服务调用是否报错：
    服务调用成功只代表命令被服务器接受，不代表机器人动了（这是实测过的坑）。
    重试与否、成功与否都以这个传感器为准。

    **这个传感器不用你选** —— 蓝图从选中的扫地机设备上自己找。同理「拖地强度」
    和「拖地模式」两个 select 也是自己找的，所以整套只填一个实体。

    推导判据（都取自设备实际能力，不靠名字）：

    | 要找 | 判据 |
    | --- | --- |
    | 任务进行中 | 该设备上 `device_class: running` 且 id 含 `task_active` |
    | 拖地强度 | 该设备上 options 同时含 `off` 与 `extreme` |
    | 拖地模式 | 该设备上 options 含 `deep_plus` |

    找不到时**告警并停止**，不猜、不跳过。

    ## 柜门

    开门由集成的 `garage_guard` 在下发命令前自动完成，本蓝图不管门。

  domain: automation
  author: kaattz
  homeassistant:
    min_version: "2024.6.0"
  input:
    target:
      name: 扫地机
      icon: mdi:robot-vacuum
      input:
        vacuum_entity:
          name: 扫地机实体
          description: >-
            只选这一个。它的「任务进行中」传感器、拖地强度、拖地模式都由蓝图
            从这台设备上自动找出，不用你挑 —— 那几个实体名字很像
            （`_v2` 和 `_v2_2`），手选容易看反。
          selector:
            entity:
              filter:
                - integration: roborock_plus
                  domain: vacuum

    schedule:
      name: 时间
      icon: mdi:clock-outline
      input:
        start_time:
          name: 启动时间
          selector:
            time:
        weekdays:
          name: 星期
          description: 只在这些星期执行。全选＝每天。
          default:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          selector:
            select:
              multiple: true
              options:
                - label: 周一
                  value: mon
                - label: 周二
                  value: tue
                - label: 周三
                  value: wed
                - label: 周四
                  value: thu
                - label: 周五
                  value: fri
                - label: 周六
                  value: sat
                - label: 周日
                  value: sun

    area:
      name: 清扫区域
      icon: mdi:floor-plan
      input:
        areas:
          name: 区域
          description: 要清扫的 HA 区域，可多选。
          selector:
            area:
              multiple: true

    mode:
      name: 清扫方式
      icon: mdi:water-opacity
      input:
        cleaning_mode:
          name: 意图
          default: 扫拖一体
          selector:
            select:
              options:
                - 仅扫地
                - 扫拖一体
                - 仅拖地
        mop_intensity:
          name: 拖地强度
          description: >-
            扫拖一体／仅拖地时使用的水量。仅扫地时忽略（蓝图强制设为 off，
            那正是"干扫"的实现方式）。
          default: medium
          selector:
            select:
              options:
                - slight
                - low
                - medium
                - moderate
                - high
                - extreme
        mop_route:
          name: 拖地模式
          description: >-
            拖地走几遍的路线，与扫地/拖地无关。蓝图会设到设备上那个
            「拖地模式」select；设备没有这个实体时就跳过。
          default: standard
          selector:
            select:
              options:
                - standard
                - deep
                - deep_plus
                - fast

    presence:
      name: 有人跳过
      icon: mdi:motion-sensor
      collapsed: true
      input:
        presence_sensors:
          name: 本区域人体传感器
          description: >-
            留空＝不检查，到点就扫。填了就只在全部无人时扫。
            只看本任务房间的传感器——例如「午饭后餐厨」填厨房和餐厅，
            人在卧室不应该阻掉这一轮。
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class: motion
                - domain: binary_sensor
                  device_class: occupancy
                - domain: binary_sensor
                  device_class: presence

    retry:
      name: 失败重试
      icon: mdi:refresh
      collapsed: true
      input:
        retry_window_minutes:
          name: 重试窗口（分钟）
          description: 在这个时间内反复尝试；0＝只试一次，不重试。
          default: 30
          selector:
            number:
              min: 0
              max: 180
              mode: box
              unit_of_measurement: 分钟
        retry_interval_minutes:
          name: 重试间隔（分钟）
          default: 5
          selector:
            number:
              min: 1
              max: 30
              mode: box
              unit_of_measurement: 分钟

    notify:
      name: 告警
      icon: mdi:bell-alert
      collapsed: true
      input:
        notify_script:
          name: 告警脚本
          description: 需要接受 title / message / level 三个参数。
          default: script.alert_notify
          selector:
            entity:
              domain: script

mode: single
max_exceeded: silent

# 取值全部是纯 !input 代入或从设备推导，不依赖"跨块设置变量是否保留"。
# 运行中不改写任何变量 —— 是否成功一律现查 task_active 传感器。
variables:
  vacuum_entity: !input vacuum_entity
  presence_sensors: !input presence_sensors
  cleaning_mode: !input cleaning_mode
  mop_intensity: !input mop_intensity
  mop_route: !input mop_route
  areas: !input areas
  retry_window: !input retry_window_minutes
  retry_interval: !input retry_interval_minutes
  notify_script: !input notify_script

  # --- 从选中的扫地机推导出三个实体，省掉三次手选 -----------------------
  #
  # 都挂在同一台设备上，所以用 device_entities(device_id(vacuum)) 一次拿到，
  # 再按"设备实际能力"挑，而不是按名字匹配 —— 名字不可靠（用户这套里
  # 拖地强度是 select.sao_di_ji_v2、拖地模式是 select.sao_di_ji_v2_2，
  # 只差一个后缀，手选极易看反）。
  #
  # 三个判据都是能力特征：
  #   task_active   device_class=running 且 id 含 task_active
  #   拖地强度       options 同时含 off（干扫）和 extreme（最大水量）
  #   拖地模式       options 含 deep_plus（该选项为它独有）
  device_entities_list: "{{ device_entities(device_id(vacuum_entity)) | default([], true) }}"

  task_active_entity: >-
    {% set found = expand(device_entities_list)
       | selectattr('entity_id', 'match', '^binary_sensor\.')
       | selectattr('attributes.device_class', 'eq', 'running')
       | selectattr('entity_id', 'search', 'task_active')
       | map(attribute='entity_id') | list %}
    {{ found[0] if found else '' }}

  mop_intensity_entity: >-
    {% set found = expand(device_entities_list)
       | selectattr('entity_id', 'match', '^select\.')
       | selectattr('attributes.options', 'defined')
       | selectattr('attributes.options', 'contains', 'off')
       | selectattr('attributes.options', 'contains', 'extreme')
       | map(attribute='entity_id') | list %}
    {{ found[0] if found else '' }}

  mop_route_entity: >-
    {% set found = expand(device_entities_list)
       | selectattr('entity_id', 'match', '^select\.')
       | selectattr('attributes.options', 'defined')
       | selectattr('attributes.options', 'contains', 'deep_plus')
       | map(attribute='entity_id') | list %}
    {{ found[0] if found else '' }}

  # 尝试次数 = 窗口/间隔 + 1，至少 1 次（窗口 0 时就是那一次）。
  max_attempts: >-
    {% set window = retry_window | int(0) %}
    {% set interval = [retry_interval | int(5), 1] | max %}
    {% set rounds = ((window / interval) | round(0, 'ceil') | int) + 1 %}
    {{ [rounds, 1] | max }}
  # 窗口 0 时 deadline 就是起始时刻；第一次尝试由下面的 repeat.index == 1 保证。
  deadline: "{{ now() + timedelta(minutes=retry_window | int(0)) }}"

triggers:
  - trigger: time
    at: !input start_time

conditions:
  - condition: time
    weekday: !input weekdays

actions:
  # 推导失败就告警并停止，不猜、不半途而废。
  # 这两个实体是必需的：没有「任务进行中」就无法判断清扫是否真的启动，
  # 没有「拖地强度」就无法表达"仅扫地"（那是靠水量 off 实现的）。
  # 它们只在设备换了、或集成改了实体命名时才会找不到。
  - if:
      - condition: template
        value_template: "{{ task_active_entity == '' or mop_intensity_entity == '' }}"
    then:
      - action: "{{ notify_script }}"
        data:
          level: warning
          title: 扫地机定时清扫：找不到设备实体
          message: >-
            从 {{ vacuum_entity }} 上无法推导出所需实体，清扫未执行。
            任务进行中传感器：{{ task_active_entity or '未找到' }}；
            拖地强度实体：{{ mop_intensity_entity or '未找到' }}。
            设备上有这些 select：{{ device_entities_list | select('match', '^select\.') | list }}；
            这些 binary_sensor：{{ device_entities_list | select('match', '^binary_sensor\.') | list }}。
      - stop: 推导失败

  - repeat:
      count: "{{ max_attempts }}"
      sequence:
        # 本轮要不要动作。repeat.index == 1 保证至少尝试一次：没有这个特例时，
        # 窗口设 0 会让 deadline 立刻过期，连第一次都被跳过。
        - variables:
            should_act: >-
              {{ not is_state(task_active_entity, 'on')
                 and (repeat.index == 1 or now() <= deadline) }}
            occupied: >-
              {% set sensors = presence_sensors | default([], true) %}
              {{ sensors | count > 0
                 and expand(sensors) | selectattr('state', 'eq', 'on')
                     | list | count > 0 }}
            busy: "{{ states(vacuum_entity) not in ['docked', 'charging'] }}"

        - if:
            - condition: template
              value_template: "{{ should_act }}"
          then:
            # 有人或扫地机正忙就什么都不做，等下一轮再看。
            - if:
                - condition: template
                  value_template: "{{ not occupied and not busy }}"
              then:
                # 扫地/拖地意图 → 底层参数。
                # "仅扫地"就是水量 off（干扫），这是 V1 协议里表达干扫的方式。
                - action: select.select_option
                  target:
                    entity_id: "{{ mop_intensity_entity }}"
                  data:
                    option: "{{ 'off' if cleaning_mode == '仅扫地' else mop_intensity }}"
                  continue_on_error: true

                # 拖地模式是可选的：有些设备没有这个实体，推导为空就跳过。
                - if:
                    - condition: template
                      value_template: >-
                        {{ mop_route_entity not in ['', none]
                           and cleaning_mode != '仅扫地' }}
                  then:
                    - action: select.select_option
                      target:
                        entity_id: "{{ mop_route_entity }}"
                      data:
                        option: "{{ mop_route }}"
                      continue_on_error: true

                - if:
                    - condition: template
                      value_template: "{{ cleaning_mode == '仅拖地' }}"
                  then:
                    - action: vacuum.set_fan_speed
                      target:
                        entity_id: "{{ vacuum_entity }}"
                      data:
                        fan_speed: off_raise_main_brush
                      continue_on_error: true

                # clean_area 会走集成的 garage_guard：门先开，再发命令。
                # 区域用 !input 静态代入，不用模板 —— 模板会把列表渲染成字符串。
                - action: vacuum.clean_area
                  target:
                    entity_id: "{{ vacuum_entity }}"
                  data:
                    cleaning_area_id: !input areas
                  continue_on_error: true

                # 确认真的启动了。服务调用成功 ≠ 机器人动了。
                # 用 wait_template 而不是 wait_for_trigger：后者只认"变化"，
                # 而任务可能在这之前就已经是 on 了。
                - wait_template: "{{ is_state(task_active_entity, 'on') }}"
                  timeout:
                    seconds: 90
                  continue_on_timeout: true

            # 还没成功就等一等再试。等一等而不是立刻重试：立刻重试会在同一个
            # 阻塞条件上反复下发命令，也会把设备打成命令风暴。
            - if:
                - condition: template
                  value_template: >-
                    {{ not is_state(task_active_entity, 'on')
                       and now() <= deadline }}
              then:
                - delay:
                    minutes: "{{ retry_interval | int(5) }}"

  # ---- 窗口内始终没扫成才告警。原因在这里现算，不依赖任何跨块变量。----
  - if:
      - condition: template
        value_template: "{{ not is_state(task_active_entity, 'on') }}"
    then:
      - action: "{{ notify_script }}"
        data:
          level: warning
          title: 扫地机定时清扫未执行
          message: >-
            {{ retry_window }} 分钟内未能启动清扫。
            区域：{{ areas | map('area_name') | join('、') }}。
            扫地机状态：{{ states(vacuum_entity) }}。
            {%- set sensors = presence_sensors | default([], true) %}
            {%- if sensors | count > 0 %}
            {%- set present = expand(sensors) | selectattr('state', 'eq', 'on')
                  | map(attribute='name') | list %}
            区域内有人：{{ present | join('、') if present else '否' }}。
            {%- else %}
            未配置人体传感器。
            {%- endif %}
            请手动处理，或调整重试窗口。
