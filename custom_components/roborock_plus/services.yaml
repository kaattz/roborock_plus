start_garage_cleaning_stage:
  name: Start protected cleaning stage
  description: Runs one cleaning stage through the garage interlock and waits until it is finished, then returns the outcome. A stage counts as finished when the task is no longer active and the robot is back on its dock. The call blocks; a timeout is reported as a failure, not a success.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
  fields:
    stage:
      name: Cleaning stage
      description: Explicit command, original parameters and complete fan, water and mop settings. Whole-home stages also require repeat settings. Unknown or incomplete stages are rejected before movement.
      required: true
      selector:
        object: {}
    timeout_minutes:
      name: Stage timeout
      description: How long to wait for this stage to finish. Defaults to the binding's configured value. On expiry the service reports a failure and the caller must not continue.
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: minutes
    previous_receipt:
      name: Previous stage receipt (retired)
      description: No longer used. Stage results are returned directly, so there is nothing to chain between stages. Accepted only so existing scripts do not break.
      selector:
        object: {}
request_garage_close:
  name: Request garage closing
  description: Requests garage closing after rechecking the task, stable dock, trusted position, household permission and manual hold. No force bypass is available.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
request_garage_open:
  name: Request garage opening
  description: Requests garage opening for an explicit household passage and waits for the full travel before reporting the door as passable. No force bypass is available. The close permission is not consulted, because it only restricts closing.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
reset_garage_control:
  name: Recheck garage control
  description: Rechecks garage control and clears recoverable faults or manual hold without moving the door or robot. Active tasks remain recorded.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
get_maps:
  name: Get maps
  description: Retrieves the map and room information of your device.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
set_vacuum_goto_position:
  name: Go to position
  description: Sends the vacuum to a specific position.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
  fields:
    x:
      example: 27500
      required: true
      selector:
        text:
          type: number
    y:
      example: 32000
      required: true
      selector:
        text:
          type: number
get_vacuum_current_position:
  name: Get current position
  description: Retrieves the current position of the vacuum.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
get_dock_position:
  name: Get dock position
  description: Retrieves the dock reference position used by Roborock Plus.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
get_safe_zone:
  name: Get danger zone
  description: Retrieves the saved danger zone for the selected vacuum.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
get_safe_zone_editor_context:
  name: Get danger zone editor context
  description: Retrieves map image, calibration, current position, and saved danger zone for the editor.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
get_safe_zone_suggestion:
  name: Get danger zone suggestion
  description: Calculates a suggested danger zone from the dock position and cabinet direction.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
  fields:
    cabinet_direction:
      name: Cabinet direction
      description: "Direction the vacuum exits the cabinet: north, south, east, or west."
      required: true
      selector:
        select:
          options:
            - north
            - south
            - east
            - west
    safe_distance_front:
      name: Safe distance front
      description: Distance in map units from the dock used to calculate the danger zone.
      required: true
      selector:
        text:
          type: number
    safe_half_width:
      name: Safe half width
      description: Half width of the danger zone in map units.
      required: true
      selector:
        text:
          type: number
    close_margin:
      name: Close margin
      description: Extra conservative margin in map units.
      required: true
      selector:
        text:
          type: number
resume_task:
  name: Resume task
  description: Resumes the current paused cleaning or docking task.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
set_safe_zone:
  name: Set danger zone
  description: Saves a manual danger zone rectangle for the selected vacuum.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
  fields:
    min_x:
      name: Min X
      required: true
      selector:
        text:
          type: number
    max_x:
      name: Max X
      required: true
      selector:
        text:
          type: number
    min_y:
      name: Min Y
      required: true
      selector:
        text:
          type: number
    max_y:
      name: Max Y
      required: true
      selector:
        text:
          type: number
clear_safe_zone:
  name: Clear danger zone
  description: Removes the saved danger zone for the selected vacuum.
  target:
    entity:
      integration: roborock_plus
      domain: vacuum
