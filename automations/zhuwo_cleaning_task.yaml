# 主卧打扫任务 —— 手工粘进 automations.yaml 的副本。
#
# 与 automations.yaml 里已有的条目格式一致：单个对象（不是列表）。
# 这条和「公区打扫任务」「次卧打扫任务」共用同一个蓝图
# kaattz/扫地机分区定时清扫.yaml。
#
# 柜门不在这条自动化里处理：集成会在下发清扫命令前先受控出库
# （开门 → goto 到安全点 → 关门），结束后再按位置决定何时开门/关门。
#
# id 不能改。它是 HA 的 unique_id，改了等于换一个自动化：历史断掉、
# 实体注册表的身份丢失，分类绑定也会丢。
#
# 分类「扫地机」不在 YAML 里设置：把 categories: 写进 automations.yaml
# 会让蓝图展开失败（自动化变 unavailable，没有 mode/current 属性），
# 分类只能通过界面或 .storage/core.entity_registry 指定。
#
# 门磁：主卧有独立房门，扫地机进不去。door_open_state 填 on ——
# 2026-11-08 实测该传感器开门报 on（当时门是开的，状态正是 on）。
# 门关着时本轮跳过，开门后自动继续，共用重试窗口。
id: '1794200000001'
alias: 主卧打扫任务
description: >-
  每周二、四、六上午 10:00 清扫主卧，仅扫地。主卧门未开时不扫，
  等开门后自动继续；不检查人体传感器。与公区、次卧共用一个蓝图，
  柜门由集成统一编排。
use_blueprint:
  path: kaattz/扫地机分区定时清扫.yaml
  input:
    vacuum_entity: vacuum.g20s_ultra
    areas:
    - zhu_wo
    cleaning_mode: 仅扫地
    presence_sensors: []
    door_sensors:
    - binary_sensor.master_bedroom_door
    door_open_state: 'on'
    my_trigger:
    - trigger: time
      at: '10:00:00'
      weekday:
      - tue
      - thu
      - sat
